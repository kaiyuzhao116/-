# 应用服务 WEB 访问端口
server:
  port: 8080

# ===== MySQL 数据源（netty_user 库）=====
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/netty_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  neo4j:
    pool:
      idle-time-before-connection-test:

# ===== MyBatis 配置 =====
mybatis:
  # XML 映射文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体别名包
  type-aliases-package: com.example.demo.netty_user.entity
  configuration:
    # 下划线列名 -> 驼峰属性名（如 create_time -> createTime）
    map-underscore-to-camel-case: true
demo:
  upload-dir: my_upload          # 对应 Java 字段 uploadDir
  max-file-size-mb: 10
  app:
    name: demo-app               # 练嵌套：再来一个内部类
    owner: kaiyu

test:
  name-test: kaiyu